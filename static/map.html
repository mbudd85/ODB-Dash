<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Trips map · OBD Dash</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    header { flex-wrap: wrap; }
    header a.back { color: var(--accent); text-decoration: none; padding: 8px 4px; white-space: nowrap; }
    header select { width: auto; flex: 1; min-width: 140px; }
    #map { flex: 1; background: #1b222c; }
    .legend { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 12px; color: var(--muted);
      border-top: 1px solid var(--line); background: var(--panel); }
    .legend .bar { flex: 1; height: 8px; border-radius: 4px; max-width: 280px; }
    .legend .sum { margin-left: auto; text-align: right; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
    .leaflet-popup-content { margin: 10px 12px; font: 13px/1.45 system-ui, sans-serif; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 1px 0; }
    .leaflet-popup-content td:last-child { text-align: right; padding-left: 12px; font-variant-numeric: tabular-nums; }
    .leaflet-popup-content b { display: block; margin-bottom: 4px; }
    .leaflet-container a { color: var(--accent); }
    .leaflet-control-attribution { background: rgba(13,17,23,.75) !important; color: var(--muted); }
    .msg { position: absolute; z-index: 1000; left: 50%; top: 40%; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
      max-width: calc(100vw - 48px); width: 360px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <a class="back" href="./">‹ Dashboard</a>
    <select id="tripSel" aria-label="Trip"></select>
    <select id="colorSel" aria-label="Colour route by"></select>
  </header>
  <div id="map"></div>
  <div class="legend"><span id="lo"></span><div class="bar" id="bar"></div><span id="hi"></span>
    <span class="sum" id="sum"></span></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
